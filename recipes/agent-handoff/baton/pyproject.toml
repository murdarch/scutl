[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scutl-baton"
version = "0.1.0"
description = "scutl recipe #29 component: estate handoff as a journaled two-phase takeover"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["scutl_baton*"]

[project.scripts]
baton = "scutl_baton.cli:main"
baton-approve = "scutl_baton.cli:approve_main"
